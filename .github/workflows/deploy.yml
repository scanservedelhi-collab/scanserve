name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        # Use `npm install` so CI won't fail due to an incomplete package-lock.json
        run: npm install

      - name: Create env for production
        # Create .env.production so Create React App embeds your REACT_APP_* vars during build.
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "One of the required secrets is missing. Please add REACT_APP_SUPABASE_URL and REACT_APP_SUPABASE_ANON_KEY in repository secrets."
            exit 1
          fi
          echo "REACT_APP_SUPABASE_URL=$SUPABASE_URL" > .env.production
          echo "REACT_APP_SUPABASE_ANON_KEY=$SUPABASE_KEY" >> .env.production

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

